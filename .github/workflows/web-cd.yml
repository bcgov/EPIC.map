name: MAP WEB CD


on:
  push:
    branches:
      - develop
    paths:
      - "map-web/**"
  # No environment input: this workflow only ever builds and tags dev. test and
  # prod are reached by promoting an existing image in deploy.yml.
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: ./map-web

env:
  APP_NAME: "map-web"
  # dev runs :latest - there is no separate :dev tag.
  ENV_NAME: "dev"

jobs:
  web-cd:
    runs-on: ubuntu-24.04

    if: github.repository == 'bcgov/EPIC.map'
    environment:
      name: "dev"

    steps:
      - uses: actions/checkout@v6

      - name: Login Openshift
        shell: bash
        run: |
          oc login --server=${{secrets.OPENSHIFT_LOGIN_REGISTRY}} --token=${{secrets.OPENSHIFT_SA_TOKEN}}

      - name: Login Docker
        run: |
          echo "${{ secrets.OPENSHIFT_SA_TOKEN }}" | 
          docker login ${{ secrets.OPENSHIFT_IMAGE_REGISTRY }} -u ${{ secrets.OPENSHIFT_SA_NAME}} --password-stdin

      # Built from the repository root: map-web depends on the @bcgov/epic-map
      # workspace, which is not resolvable from map-web/ alone.
      - name: Build image
        working-directory: ./
        run: |
          docker build . --file map-web/Dockerfile --tag image

      - name: Push image
        run: |
          IMAGE_ID=${{ secrets.OPENSHIFT_IMAGE_REGISTRY }}/"${{ secrets.OPENSHIFT_REPOSITORY}}-tools"/$APP_NAME
          docker tag image $IMAGE_ID:latest
          docker push $IMAGE_ID:latest

      # A Deployment has no ImageChange trigger, and the image reference in the
      # chart does not change when the tag is re-pushed, so the restart is what
      # actually pulls the new image.
      - name: Rollout
        shell: bash
        run: |
          oc rollout restart deployment/${{ env.APP_NAME }} -n ${{ secrets.OPENSHIFT_REPOSITORY }}-${{ env.ENV_NAME }}
          oc rollout status deployment/${{ env.APP_NAME }} -n ${{ secrets.OPENSHIFT_REPOSITORY }}-${{ env.ENV_NAME }} -w
