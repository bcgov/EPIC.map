# nginx.conf — the EPIC map's federated remote.
#
# This server exists to hand JavaScript to other origins. Everything below that
# is not boilerplate is there because a Module Federation remote is loaded
# cross-origin by applications that are not this one.
worker_processes auto;
error_log /var/log/nginx/error.log;

pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;

  # nginx 1.27's mime.types still has no entry for .mjs, so a module script goes
  # out as application/octet-stream — and X-Content-Type-Options: nosniff below
  # means the browser then refuses to run it. maplibre's web worker arrives
  # exactly that way (/assets/maplibre-gl-worker.mjs, loaded as a module worker),
  # and a map whose worker never starts draws an empty canvas with working
  # controls and no tiles.
  #
  # A second `types` block adds to the table rather than replacing it, so this
  # stops doing anything the day the base image learns .mjs itself.
  types {
    text/javascript mjs;

    # /epic-map.d.ts is the public contract, served for host teams to vendor and
    # diff. mime.types calls .ts an MPEG transport stream, so without this it
    # arrives as video and a browser offers to save it instead of showing it.
    # Overriding an extension is legal and logs one warning at every start -
    # `duplicate extension "ts"` - which is this line, working as intended.
    text/plain      ts;
  }

  # Everything served here is UTF-8. Without this the contract at /epic-map.d.ts
  # goes out as bare text/plain and a browser falls back to latin-1, which turns
  # the em-dashes in its comments into mojibake.
  charset utf-8;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp_path;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;
  default_type application/octet-stream;
  server_tokens off;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /dev/stdout main;

  gzip on;
  gzip_types text/javascript application/javascript text/css application/json image/svg+xml;
  gzip_min_length 1024;

  # How long each thing here may be cached, decided by path.
  #
  # Vite content-hashes everything under /assets, so a given URL's bytes never
  # change and it can be held for as long as a browser will hold anything.
  #
  # Two exceptions, both of which must be revalidated:
  #
  #   remoteEntry.js is the entry point and the one file whose name never
  #   changes. A host resolves every other asset through it, so a cached copy
  #   pins the whole remote at the version it names — which is how a deploy goes
  #   out and nobody sees it, for as long as the cache lives.
  #
  #   maplibre's worker pair is emitted under its real names rather than hashed,
  #   because the worker imports its sibling by a path written into maplibre's
  #   own source and nothing downstream can rewrite it.
  #
  # Ordered: nginx tries exact strings first, then each regex in the order
  # written, so the maplibre pattern has to precede the general /assets/ one.
  map $uri $epic_cache_control {
    default                                     "no-cache";
    ~^/assets/maplibre-gl-(worker|shared)\.mjs$ "no-cache";
    ~^/assets/                                  "public, max-age=31536000, immutable";
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    error_log /dev/stdout info;

    # One location, because every path here wants the same headers and differs
    # only in how long it may be cached — and nginx's add_header does not merge:
    # a second location with one add_header of its own silently drops every
    # header inherited from the server block. Keeping it to one location is what
    # stops that from being a trap.
    location / {
      # Preflight. maplibre loads its worker as a cross-origin module import,
      # which is a CORS request and can be preflighted; answering here rather
      # than falling through avoids try_files 404ing an OPTIONS.
      #
      # `if` with nothing but add_header and return is the documented-safe use of
      # it, and add_header is only allowed in an `if` inside a location — not in
      # one at server level.
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Range" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0 always;
        return 204;
      }

      # Access-Control-Allow-Origin is "*" because every byte here is public,
      # versioned build output. Nothing on this origin reads a cookie, a session
      # or an Authorization header — the map's API calls are made by the host
      # against map-api, which enforces its own CORS and auth. There is therefore
      # nothing for a permissive origin to leak, and pinning the header to a list
      # of hosts would mean redeploying the map to onboard EPIC.centre or
      # EPIC.submit.
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Range" always;
      add_header Timing-Allow-Origin "*" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Cache-Control $epic_cache_control always;

      # No X-Frame-Options and no frame-ancestors: this origin serves no page
      # anyone frames. Its assets are executed by host documents on other
      # origins, where the host's own framing policy is the one that counts.

      try_files $uri $uri/ =404;
    }
  }
}
