# nginx.conf
worker_processes auto;
error_log  /var/log/nginx/error.log;

pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp_path;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;
  default_type  application/octet-stream;
  server_tokens off;
  underscores_in_headers on;

  # Use a w3c standard log format
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

  access_log  /var/log/nginx/access.log  main;


  server {

    # disable TRACE and OPTIONS methods
    if ($request_method = OPTIONS)
    {
      return 405;
    }
    if ($request_method = TRACE)
    {
      return 405;
    }

    # add in most common security headers
    add_header Content-Security-Policy "default-src * data: blob: filesystem: 'unsafe-inline' 'unsafe-eval'";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection 1;
    add_header X-Frame-Options SAMEORIGIN;

    listen 8080;
    server_name _;

    index index.html;
    error_log /dev/stdout info;
    access_log /dev/stdout;

    location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;
    }

    # This image's mime.types predates .mjs, so a module script would go out as
    # application/octet-stream, and X-Content-Type-Options: nosniff above means
    # the browser then refuses to run it. maplibre's web worker arrives exactly
    # that way - /assets/maplibre-gl-worker.mjs, loaded as a module worker - and
    # a map whose worker never starts draws an empty canvas with working
    # controls and no tiles.
    #
    # default_type only fills in where the type table has no entry, so this
    # stops doing anything the day the base image learns .mjs itself.
    location ~ \.mjs$ {
      root   /usr/share/nginx/html;
      default_type application/javascript;
    }

    error_page   500 502 503 504  /50x.html;

    location = /50x.html {
      root   /usr/share/nginx/html;
    }
  }
}
