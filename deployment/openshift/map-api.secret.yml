# Template only. Fill in the real value and apply it into the namespace by hand -
# never commit a filled-in copy. This repo is public.
#
#   oc project c8b80a-dev
#   oc create secret generic map-api-secrets \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)"
#
# or, from this file with the placeholder replaced:
#
#   oc apply -f map-api.secret.yml -n c8b80a-dev
kind: Secret
apiVersion: v1
metadata:
  name: map-api-secrets
stringData:
  # Flask session/signing key. ProdConfig falls back to a one-shot random key and
  # warns when this is missing, which breaks anything signed across a restart or
  # across replicas. 32+ random bytes, different in every environment.
  SECRET_KEY: <SECRET_KEY>
type: Opaque
