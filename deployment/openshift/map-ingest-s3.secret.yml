# Template only. Fill in the real values and apply it into the namespace by hand -
# never commit a filled-in copy. This repo is public.
#
#   oc project c8b80a-dev
#   oc create secret generic map-ingest-s3 \
#     --from-literal=S3_BUCKET=<BUCKET_NAME> \
#     --from-literal=S3_HOST=<OBJECT_STORE_HOST> \
#     --from-literal=S3_REGION=us-east-1 \
#     --from-literal=S3_ACCESS_KEY_ID=<ACCESS_KEY> \
#     --from-literal=S3_SECRET_ACCESS_KEY=<SECRET_KEY>
#
# or, from this file with the placeholders replaced:
#
#   oc apply -f map-ingest-s3.secret.yml -n c8b80a-dev
#
# Read only by the map-api-ingest CronJob, which the map-api chart creates when
# ingest.enabled is true. The API itself never touches these.
kind: Secret
apiVersion: v1
metadata:
  name: map-ingest-s3
stringData:
  # Not a credential, but here rather than in a values file all the same: those
  # are public, and naming EAO's bucket and endpoint in a public repository
  # publishes something nobody asked us to. It also means one object to create and
  # one to rotate. See README.md.
  S3_BUCKET: <BUCKET_NAME>
  # A hostname, no scheme - config.s3_endpoint assumes https.
  S3_HOST: <OBJECT_STORE_HOST>
  # SigV4 needs one even where the store ignores it. config.py defaults to
  # us-east-1 when this is blank.
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: <ACCESS_KEY>
  S3_SECRET_ACCESS_KEY: <SECRET_KEY>
type: Opaque
