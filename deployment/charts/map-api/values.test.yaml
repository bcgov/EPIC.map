# c8b80a-test
image:
  tag: "test"

auth:
  jwt:
    issuer: https://test.loginproxy.gov.bc.ca/auth/realms/eao-epic
    wellKnownConfig: https://test.loginproxy.gov.bc.ca/auth/realms/eao-epic/.well-known/openid-configuration
  keycloak:
    uri: https://test.loginproxy.gov.bc.ca
    realm: eao-epic

# Every EPIC application that embeds the map needs its origin here - the widget
# runs in the host's page, so the host's origin is what the browser sends.
corsOrigin: "https://map-web-c8b80a-test.apps.gold.devops.gov.bc.ca,https://test.centre.eao.gov.bc.ca"

# Keycloak clients whose tokens this API accepts. See ALLOWED_CLIENT_IDS in
# map-api/src/map_api/config.py for why this is a list and not one audience.
allowedClientIds: "epic-centre,epic-map"

# Temporary gate while testers come in: a role under these groups, e.g. /TRACK/VIEWER. NO_ROLE grants nothing.
allowedAppGroups: "TRACK"

# EPIC.Track's API base URL for this environment, without /api/v1. The project
# dots come from it, and the EAO footprints are filtered to the projects those
# dots are drawn for - so an empty value here draws no footprints either.
epicTrack:
  apiUrl: "https://epictrack-api-c8b80a-test.apps.gold.devops.gov.bc.ca"

# The hosted-layer ingest. Both layers run, as in dev, so both deliveries have
# to be in the bucket this namespace's map-ingest-s3 names - PIP's .gpkg and
# its .lyrx, and EAO's .gpkg. A layer whose delivery is absent fails its
# CronJob every morning rather than doing nothing.
ingest:
  enabled: true

resources:
  cpu:
    limit: 500m
    request: 100m
  memory:
    limit: 512Mi
    request: 256Mi
