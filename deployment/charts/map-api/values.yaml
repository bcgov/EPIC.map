# Shared defaults. Per-environment files carry everything that differs, and no
# secret value appears in any of them - see deployment/openshift/README.md.
# Install with:  helm upgrade --install map-api . -f values.yaml -f values.dev.yaml -n c8b80a-dev

replicaCount: 1

image:
  # Full registry path. A Deployment resolves the image itself - there is no
  # ImageStream trigger to rewrite a bare name, so promoting a tag needs an
  # `oc rollout restart` (see .github/workflows/deploy.yml). dev runs :latest.
  repository: image-registry.openshift-image-registry.svc:5000/c8b80a-tools/map-api
  pullPolicy: Always
  tag: "latest"

resources:
  cpu:
    limit: 250m
    request: 150m
  memory:
    limit: 384Mi
    request: 256Mi

# The pod serves `processes x threads` requests at once. Threads are what carry
# calls that sit waiting on an upstream (the BCGW), which would otherwise hold
# the whole pod. Processes stay at 1: the CPU limit above is a quarter core.
gunicorn:
  processes: 1
  threads: 8

database:
  # Generated by the operator as <cluster>-pguser-<user>; both halves come from
  # fullnameOverride in deployment/charts/map-database/values.yaml.
  secret: map-db-pguser-map-db
  service:
    # Connections go through pgBouncer, not straight at map-db-primary.
    name: map-db-pgbouncer
    port: 5432

redis:
  # Written by deployment/charts/map-redis; REDIS_URL carries its own password.
  secret: map-redis

# Created by hand in the namespace, never by this chart - it holds SECRET_KEY.
secretName: map-api-secrets

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# Deployed environments all run ProdConfig: SQL echo off, no swagger, and no
# localhost CORS fallback. See get_named_config in map-api/src/map_api/config.py.
flaskEnv: production

python:
  pythonBuffered: 1
  connectTimeout: 60

auth:
  jwt:
    alg: RS256
    # Inert as an audience check - auth.py replaces it with allowedClientIds -
    # but flask-jwt-oidc requires it, and it is the fallback when that list is
    # unset, so it names this API's own client.
    aud: epic-map
    cacheEnabled: true
    cacheTimeout: "300"

# A rollout surges a second pod before dropping the old one. Environments with
# quota headroom keep that; see values.dev.yaml for the namespace that doesn't.
rollout:
  maxSurge: 25%
  maxUnavailable: 25%

# The hosted-layer ingest, as a CronJob. Off by default: it runs a second image
# (built from map-api/Dockerfile.ingest, which carries GDAL) and needs an
# object-store secret created by hand in the namespace, so an environment opts in
# once both exist. See deployment/openshift/README.md and the template's comment
# for why its failure settings are what they are.
ingest:
  enabled: false
  # Daily at 09:00 UTC, roughly 02:00 Pacific: after any overnight re-export and
  # early enough that a failure is found during the working day.
  schedule: "0 9 * * *"
  # Kubernetes 1.27+ / OCP 4.14+ only. Blank it for an older cluster.
  timeZone: Etc/UTC
  # A key of INGEST_SPECS in local_layer_service/ingest_spec.py.
  layer: pip
  image:
    repository: image-registry.openshift-image-registry.svc:5000/c8b80a-tools/map-api-ingest
    # Both unset: the template falls back to image.pullPolicy and image.tag, so
    # the ingest follows whatever tag this environment's API runs. Set tag here
    # only to pin the ingest to a different build from the API.
    pullPolicy: ""
    tag: ""
  s3:
    # Created by hand, never by this chart: bucket, endpoint and keys.
    secret: map-ingest-s3
  workDir:
    sizeLimit: 2Gi
  activeDeadlineSeconds: 3600
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  # Deep on purpose: a failed Job and its log are the alert.
  failedJobsHistoryLimit: 10
  resources:
    cpu:
      limit: 1000m
      request: 100m
    memory:
      # Burstable. The heavy memory in this pipeline is the database's, not this
      # pod's - ogr2ogr streams, the sha256 streams, and the transform runs
      # server-side - so the request stays small enough to schedule.
      limit: 1Gi
      request: 256Mi
    ephemeralStorage:
      # Matches workDir.sizeLimit: without a request the scheduler does not know
      # the pod needs room for the download, and an evicted pod is a failure that
      # reads like a mystery.
      limit: 2Gi
      request: 512Mi
