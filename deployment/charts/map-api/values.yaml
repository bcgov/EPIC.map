# Shared defaults. Per-environment files carry everything that differs, and no
# secret value appears in any of them - see deployment/openshift/README.md.
# Install with:  helm upgrade --install map-api . -f values.yaml -f values.dev.yaml -n c8b80a-dev

replicaCount: 1

image:
  # Full registry path. A Deployment resolves the image itself - there is no
  # ImageStream trigger to rewrite a bare name, so promoting a tag needs an
  # `oc rollout restart` (see .github/workflows/deploy.yml). dev runs :latest.
  repository: image-registry.openshift-image-registry.svc:5000/c8b80a-tools/map-api
  pullPolicy: Always
  tag: "latest"

resources:
  cpu:
    limit: 250m
    request: 150m
  memory:
    limit: 384Mi
    request: 256Mi

database:
  # Generated by the operator as <cluster>-pguser-<user>; both halves come from
  # fullnameOverride in deployment/charts/map-database/values.yaml.
  secret: map-db-pguser-map-db
  service:
    # Connections go through pgBouncer, not straight at map-db-primary.
    name: map-db-pgbouncer
    port: 5432

redis:
  # Written by deployment/charts/map-redis; REDIS_URL carries its own password.
  secret: map-redis

# Created by hand in the namespace, never by this chart - it holds SECRET_KEY.
secretName: map-api-secrets

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

# Deployed environments all run ProdConfig: SQL echo off, no swagger, and no
# localhost CORS fallback. See get_named_config in map-api/src/map_api/config.py.
flaskEnv: production

python:
  pythonBuffered: 1
  connectTimeout: 60

auth:
  jwt:
    alg: RS256
    # Inert as an audience check - auth.py replaces it with allowedClientIds -
    # but flask-jwt-oidc requires it, and it is the fallback when that list is
    # unset, so it names this API's own client.
    aud: epic-map
    cacheEnabled: true
    cacheTimeout: "300"

# A rollout surges a second pod before dropping the old one. Environments with
# quota headroom keep that; see values.dev.yaml for the namespace that doesn't.
rollout:
  maxSurge: 25%
  maxUnavailable: 25%
