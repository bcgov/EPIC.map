{{- if .Values.ingest.enabled }}
{{/*
The hosted-layer ingest, on a schedule.

Nobody is watching at 09:00, and only two things carry a failure: the Job's
status and the row the script writes into cache.local_layer_loads. So:

  backoffLimit 0 + restartPolicy Never   one attempt, one verdict - a Job that
                                         retried and succeeded reads as green
  no ttlSecondsAfterFinished             it would delete the Job and its log
  failedJobsHistoryLimit 10              ten days of failures stay on screen
  concurrencyPolicy Forbid               an overrunning run does not meet the
                                         next; the advisory lock says it again
                                         for hand-started runs

Runs a different image from the API (Dockerfile.ingest, which carries GDAL) and
is off unless an environment opts in: it needs an object-store secret created
by hand first. See deployment/openshift/README.md.
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: "{{ .Chart.Name }}-ingest"
  labels:
    app: "{{ .Chart.Name }}-ingest"
spec:
  schedule: "{{ .Values.ingest.schedule }}"
  {{- if .Values.ingest.timeZone }}
  # Needs Kubernetes 1.27+ (OCP 4.14+). Unset it on an older cluster: the control
  # plane runs UTC, so the schedule means the same thing either way.
  timeZone: {{ .Values.ingest.timeZone }}
  {{- end }}
  concurrencyPolicy: Forbid
  # A controller outage inside the hour still runs today's load; past that,
  # tomorrow's covers it and a queue of catch-up jobs is what Forbid prevents.
  startingDeadlineSeconds: {{ .Values.ingest.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.ingest.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.ingest.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 0
      # The load is single-digit minutes; an hour bounds a hung socket. With
      # backoffLimit 0 a timed-out Job ends Failed, which is right.
      activeDeadlineSeconds: {{ .Values.ingest.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app: "{{ .Chart.Name }}-ingest"
        spec:
          restartPolicy: Never
          volumes:
            # Tens of megabytes, kept off the pod's writable layer. TMPDIR
            # below is what sends it here.
            - name: work
              emptyDir:
                sizeLimit: {{ .Values.ingest.workDir.sizeLimit }}
          containers:
            - name: ingest
              # Falls back to the API's tag, so promoting map-api:test gets
              # map-api-ingest:test without naming it twice. Pin
              # ingest.image.tag only to run a different build from the API.
              image: "{{ .Values.ingest.image.repository }}:{{ .Values.ingest.image.tag | default .Values.image.tag }}"
              imagePullPolicy: {{ .Values.ingest.image.pullPolicy | default .Values.image.pullPolicy }}
              # The image's ENTRYPOINT is the script, so these are only its flags.
              args:
                - "--layer"
                - "{{ .Values.ingest.layer }}"
                - "--from-s3"
              volumeMounts:
                - name: work
                  mountPath: /work
              env:
                - name: TMPDIR
                  value: /work
                # Explicit, so a PATH that has lost ogr2ogr fails loudly
                # rather than trying a `docker run` no pod can make.
                - name: INGEST_GDAL
                  value: local
                - name: DATABASE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.database.secret }}
                      key: user
                - name: DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.database.secret }}
                      key: password
                - name: DATABASE_NAME
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.database.secret }}
                      key: dbname
                # The primary, not pgBouncer: the load holds a session-level
                # advisory lock, and a transaction-pooled connection is not a
                # session. The operator writes the primary into this secret.
                - name: DATABASE_HOST
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.database.secret }}
                      key: host
                - name: DATABASE_PORT
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.database.secret }}
                      key: port
              envFrom:
                # FLASK_ENV, so the ingest reads the API's profile. It logs
                # the ProdConfig SECRET_KEY warning, which is harmless:
                # map-api-secrets is not mounted, the ingest signing nothing.
                - configMapRef:
                    name: {{ .Chart.Name }}
                # Created by hand: bucket, endpoint, keys. See the README.
                - secretRef:
                    name: {{ .Values.ingest.s3.secret }}
              resources:
                limits:
                  cpu: {{ .Values.ingest.resources.cpu.limit }}
                  memory: {{ .Values.ingest.resources.memory.limit }}
                  ephemeral-storage: {{ .Values.ingest.resources.ephemeralStorage.limit }}
                requests:
                  cpu: {{ .Values.ingest.resources.cpu.request }}
                  memory: {{ .Values.ingest.resources.memory.request }}
                  ephemeral-storage: {{ .Values.ingest.resources.ephemeralStorage.request }}
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
{{- end }}
