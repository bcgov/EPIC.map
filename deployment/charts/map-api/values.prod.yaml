# c8b80a-prod
image:
  tag: "prod"

auth:
  jwt:
    issuer: https://loginproxy.gov.bc.ca/auth/realms/eao-epic
    wellKnownConfig: https://loginproxy.gov.bc.ca/auth/realms/eao-epic/.well-known/openid-configuration
  keycloak:
    uri: https://loginproxy.gov.bc.ca
    realm: eao-epic

# Every EPIC application that embeds the map needs its origin here - the widget
# runs in the host's page, so the host's origin is what the browser sends. Add
# EPIC.Centre's prod origin when the map ships there.
corsOrigin: "https://map-web-c8b80a-prod.apps.gold.devops.gov.bc.ca"

# Keycloak clients whose tokens this API accepts. See ALLOWED_CLIENT_IDS in
# map-api/src/map_api/config.py for why this is a list and not one audience.
allowedClientIds: "epic-centre,epic-map"

# Temporary gate while testers come in: a role under these groups, e.g. /TRACK/VIEWER. NO_ROLE grants nothing.
allowedAppGroups: "TRACK"

# EPIC.Track's API base URL for this environment, without /api/v1.
epicTrack:
  apiUrl: ""

resources:
  cpu:
    limit: 500m
    request: 100m
  memory:
    limit: 512Mi
    request: 256Mi
