apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: {{ .Values.app }}
  labels:
    app: {{ .Values.app }}
spec:
  nodeSelector: null
  output:
    to:
      kind: ImageStreamTag
      name: '{{ .Values.app }}:latest'
  successfulBuildsHistoryLimit: 5
  failedBuildsHistoryLimit: 5
  strategy:
    type: Docker
    dockerStrategy:
      # Relative to contextDir. The ingest image is a second Dockerfile in the
      # same directory - see charts/map-api-ingest.bc.
      dockerfilePath: {{ .Values.dockerfilePath | default "Dockerfile" }}
  postCommit: {}
  source:
    type: Git
    # contextDir belongs to source, not to git - the API prunes unknown fields
    # under git without complaining, and the build then looks for the Dockerfile
    # at the repository root.
    {{- if .Values.githubContextDir }}
    contextDir: {{ .Values.githubContextDir }}
    {{- end }}
    git:
      uri: {{ .Values.githubRepo }}
      ref: {{ .Values.githubRef }}
  triggers:
  - type: ConfigChange
runPolicy: Serial
