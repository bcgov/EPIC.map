apiVersion: route.openshift.io/v1
kind: Route
metadata:
  labels:
    app: {{ .Values.app.name }}
  name: {{ .Chart.Name }}
spec:
  # app.url carries the scheme for the OIDC redirect_uri; a Route host must not.
  host: {{ tpl .Values.app.url . | replace "https://" "" }}
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: {{ .Chart.Name }}
  wildcardPolicy: None
