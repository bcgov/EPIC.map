apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: {{ .Chart.Name }}
  name: {{ .Chart.Name }}
data:
  # Read by map-web/src/utils/config.ts as window._env_, which falls back to
  # import.meta.env when a key is absent. The names must stay VITE_-prefixed to
  # match that file - this is a Vite app, not Create React App.
  config.js: |-
    window._env_ = {
      "VITE_API_URL": "{{ tpl .Values.app.api . }}",
      "VITE_APP_URL": "{{ tpl .Values.app.url . }}",
      "VITE_APP_TITLE": "{{ .Values.app.title }}",
      "VITE_ENV": "{{ .Values.app.env }}",
      "VITE_VERSION": "{{ .Values.image.tag }}",
      "VITE_OIDC_AUTHORITY": "{{ .Values.keycloak.url }}/auth/realms/{{ .Values.keycloak.realm }}",
      "VITE_CLIENT_ID": "{{ .Values.keycloak.client }}"
    };
