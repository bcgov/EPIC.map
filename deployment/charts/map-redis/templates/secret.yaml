{{/*
Reuse the password already in the cluster so an upgrade never rotates it out from
under a running map-api; generate one only on first install.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Chart.Name }}
{{- $password := "" }}
{{- if and $existing $existing.data (index $existing.data "REDIS_PASSWORD") }}
{{- $password = index $existing.data "REDIS_PASSWORD" | b64dec }}
{{- else }}
{{- $password = .Values.auth.password | default (randAlphaNum 32) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    name: {{ .Chart.Name }}
  name: {{ .Chart.Name }}
stringData:
  REDIS_PASSWORD: {{ $password | quote }}
  # map-api reads this whole URL; config.py prefers REDIS_URL over the host/port parts.
  REDIS_URL: {{ printf "redis://:%s@%s.%s.svc:%v/%v" (urlquery $password) .Chart.Name .Release.Namespace .Values.service.port .Values.redis.db | quote }}
